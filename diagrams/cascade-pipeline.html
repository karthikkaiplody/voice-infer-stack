<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One turn through the pipeline</title>
<style>
  :root {
    --paper: #fbfaf6; --ink: #2a2823; --muted: #8a867c;
    --red: #b3382c; --red-fill: #f8e9e6; --box-fill: #ffffff;
  }
  [data-theme="dark"] {
    --paper: #1e1d1a; --ink: #e9e7e1; --muted: #8f8b81;
    --red: #e08070; --red-fill: #38251f; --box-fill: #26251f;
  }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  body { display: grid; place-items: center; }
  svg { display: block; }
  .hand { font-family: "Chalkboard SE", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.dataset.theme = t;
  else document.documentElement.dataset.theme =
    matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<svg viewBox="0 0 1600 760" width="1600" height="760" role="img"
     aria-label="Pipeline: you speak, Silero VAD, endpointing, Whisper, Llama, Kokoro, you hear. Every box swappable.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
  </defs>

  <g transform="translate(0, 100)">
  <!-- title -->
  <text class="hand" x="80" y="120" font-size="38" fill="var(--ink)">One turn through the pipeline</text>
  <text class="mono" x="82" y="152" font-size="15" fill="var(--muted)">all local — mic to speaker, nothing leaves the machine</text>

  <g filter="url(#rough)" fill="none" stroke-width="1.8">
    <!-- endpoint labels -->
    <text class="hand" x="60" y="340" font-size="22" fill="var(--ink)" stroke="none">you speak</text>
    <text class="hand" x="1452" y="340" font-size="22" fill="var(--ink)" stroke="none">you hear</text>

    <!-- arrows -->
    <g stroke="var(--ink)">
      <line x1="152" y1="346" x2="186" y2="346"/>
      <path d="M180 339 L190 346 L180 353"/>
      <line x1="372" y1="346" x2="426" y2="346"/>
      <path d="M420 339 L430 346 L420 353"/>
      <line x1="642" y1="346" x2="696" y2="346"/>
      <path d="M690 339 L700 346 L690 353"/>
      <line x1="902" y1="346" x2="956" y2="346"/>
      <path d="M950 339 L960 346 L950 353"/>
      <line x1="1152" y1="346" x2="1206" y2="346"/>
      <path d="M1200 339 L1210 346 L1200 353"/>
      <line x1="1402" y1="346" x2="1446" y2="346"/>
      <path d="M1440 339 L1450 346 L1440 353"/>
    </g>

    <!-- boxes -->
    <g stroke="var(--ink)">
      <rect x="190" y="304" width="180" height="84" rx="10" fill="var(--box-fill)"/>
      <rect x="430" y="304" width="210" height="84" rx="10" fill="var(--red-fill)" stroke="var(--red)" stroke-width="2.2"/>
      <rect x="700" y="304" width="200" height="84" rx="10" fill="var(--box-fill)"/>
      <rect x="960" y="304" width="190" height="84" rx="10" fill="var(--box-fill)"/>
      <rect x="1210" y="304" width="190" height="84" rx="10" fill="var(--box-fill)"/>
    </g>

    <!-- swap bracket -->
    <g stroke="var(--muted)" stroke-dasharray="7 6" stroke-width="1.5">
      <line x1="280" y1="470" x2="1305" y2="470"/>
      <line x1="280" y1="462" x2="280" y2="470"/>
      <line x1="1305" y1="462" x2="1305" y2="470"/>
    </g>
  </g>

  <!-- box labels (not displaced) -->
  <g text-anchor="middle">
    <text class="hand" x="280" y="340" font-size="23" fill="var(--ink)">Silero VAD</text>
    <text class="mono" x="280" y="364" font-size="13" fill="var(--muted)">voice activity</text>

    <text class="hand" x="535" y="340" font-size="23" fill="var(--red)">Endpointing</text>
    <text class="mono" x="535" y="364" font-size="13" fill="var(--muted)">Smart Turn or stop_secs</text>

    <text class="hand" x="800" y="340" font-size="23" fill="var(--ink)">Whisper</text>
    <text class="mono" x="800" y="364" font-size="13" fill="var(--muted)">MLX · segmented</text>

    <text class="hand" x="1055" y="340" font-size="23" fill="var(--ink)">Llama 3.2</text>
    <text class="mono" x="1055" y="364" font-size="13" fill="var(--muted)">Ollama</text>

    <text class="hand" x="1305" y="340" font-size="23" fill="var(--ink)">Kokoro</text>
    <text class="mono" x="1305" y="364" font-size="13" fill="var(--muted)">TTS · ONNX</text>
  </g>

  <!-- arrow labels -->
  <g class="mono" font-size="12.5" fill="var(--muted)" text-anchor="middle">
    <text x="120" y="400">20 ms frames</text>
    <text x="400" y="400">speech on/off</text>
    <text x="670" y="400">end of turn</text>
    <text x="930" y="400">whole transcript</text>
    <text x="1180" y="400">token stream</text>
    <text x="1426" y="400">audio chunks</text>
  </g>

  <!-- the wait note -->
  <text class="hand" x="535" y="252" font-size="19" fill="var(--red)" text-anchor="middle">the wait lives here</text>
  <g filter="url(#rough)" fill="none" stroke="var(--red)" stroke-width="1.8">
    <line x1="535" y1="262" x2="535" y2="290"/>
    <path d="M528 282 L535 292 L542 282"/>
  </g>

  <!-- bracket caption -->
  <text class="hand" x="792" y="508" font-size="19" fill="var(--muted)" text-anchor="middle">any box swaps with one VOICE_* variable — factory.py is the seam</text>
  </g>
</svg>
</body>
</html>
