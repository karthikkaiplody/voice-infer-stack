<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where 1,671 ms goes</title>
<style>
  :root {
    --paper: #fbfaf6; --ink: #2a2823; --muted: #8a867c;
    --red: #b3382c; --red-fill: #f8e9e6; --grey-fill: #e6e3dc; --box-fill: #ffffff;
  }
  [data-theme="dark"] {
    --paper: #1e1d1a; --ink: #e9e7e1; --muted: #8f8b81;
    --red: #e08070; --red-fill: #38251f; --grey-fill: #3a3833; --box-fill: #26251f;
  }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  body { display: grid; place-items: center; }
  svg { display: block; }
  .hand { font-family: "Chalkboard SE", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.dataset.theme = t;
  else document.documentElement.dataset.theme =
    matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<!-- plot: x = 140 + ms * 0.7556, 0..1800 ms -->
<svg viewBox="0 0 1600 760" width="1600" height="760" role="img"
     aria-label="Timeline of one turn: 1102 ms turn detection wait, 1042 ms speech-to-text overlapping it, 218 ms LLM, 350 ms TTS. First audio at 1671 ms.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="var(--grey-fill)"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="var(--paper)" stroke-width="3.5"/>
    </pattern>
  </defs>

  <text class="hand" x="80" y="105" font-size="38" fill="var(--ink)">Where 1,671 ms goes</text>
  <text class="mono" x="82" y="137" font-size="15" fill="var(--muted)">median recorded run · artifacts/reference-traces.jsonl</text>

  <g filter="url(#rough)" fill="none" stroke-width="1.8">
    <!-- t0 -->
    <line x1="140" y1="225" x2="140" y2="575" stroke="var(--ink)" stroke-dasharray="6 6" stroke-width="1.5"/>
    <!-- 800 ms window -->
    <line x1="744" y1="225" x2="744" y2="575" stroke="var(--muted)" stroke-dasharray="3 7" stroke-width="1.5"/>
    <!-- first audio -->
    <line x1="1403" y1="225" x2="1403" y2="520" stroke="var(--red)" stroke-width="2"/>

    <!-- bars -->
    <rect x="60"  y="312" width="80"  height="46" rx="8" fill="url(#hatch)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="140" y="250" width="833" height="46" rx="8" fill="var(--red-fill)" stroke="var(--red)" stroke-width="2"/>
    <rect x="140" y="312" width="787" height="46" rx="8" fill="var(--grey-fill)" stroke="var(--ink)" stroke-width="1.5"/>
    <rect x="973"  y="374" width="164" height="46" rx="8" fill="var(--box-fill)" stroke="var(--ink)"/>
    <rect x="1137" y="436" width="266" height="46" rx="8" fill="var(--box-fill)" stroke="var(--ink)"/>

    <!-- axis -->
    <line x1="140" y1="590" x2="1500" y2="590" stroke="var(--ink)"/>
    <g stroke="var(--ink)" stroke-width="1.4">
      <line x1="140" y1="590" x2="140" y2="598"/><line x1="291" y1="590" x2="291" y2="598"/>
      <line x1="442" y1="590" x2="442" y2="598"/><line x1="593" y1="590" x2="593" y2="598"/>
      <line x1="744" y1="590" x2="744" y2="598"/><line x1="896" y1="590" x2="896" y2="598"/>
      <line x1="1047" y1="590" x2="1047" y2="598"/><line x1="1198" y1="590" x2="1198" y2="598"/>
      <line x1="1349" y1="590" x2="1349" y2="598"/><line x1="1500" y1="590" x2="1500" y2="598"/>
    </g>
  </g>

  <!-- labels -->
  <text class="hand" x="150" y="212" font-size="18" fill="var(--ink)">t0 — you stop speaking</text>
  <text class="hand" x="756" y="212" font-size="16" fill="var(--muted)">800 ms — the human window</text>

  <text class="hand" x="170" y="280" font-size="19" fill="var(--red)">turn detection — two config timers, zero computing</text>
  <text class="mono" x="958" y="280" font-size="14" fill="var(--red)" text-anchor="end">1,102 ms</text>

  <text class="hand" x="170" y="342" font-size="19" fill="var(--ink)">speech-to-text — overlaps the wait</text>
  <text class="mono" x="912" y="342" font-size="14" fill="var(--ink)" text-anchor="end">1,042 ms</text>
  <text class="mono" x="100" y="382" font-size="11.5" fill="var(--muted)" text-anchor="middle">while you</text>
  <text class="mono" x="100" y="396" font-size="11.5" fill="var(--muted)" text-anchor="middle">talk: free</text>

  <text class="mono" x="1055" y="403" font-size="14" fill="var(--ink)" text-anchor="middle">llm · 218 ms</text>
  <text class="mono" x="1270" y="465" font-size="14" fill="var(--ink)" text-anchor="middle">tts · 350 ms</text>

  <text class="hand" x="1390" y="530" font-size="20" fill="var(--red)" text-anchor="end">first audio · 1,671 ms</text>

  <g class="mono" font-size="12.5" fill="var(--muted)" text-anchor="middle">
    <text x="140" y="616">0</text><text x="291" y="616">200</text><text x="442" y="616">400</text>
    <text x="593" y="616">600</text><text x="744" y="616">800</text><text x="896" y="616">1000</text>
    <text x="1047" y="616">1200</text><text x="1198" y="616">1400</text><text x="1349" y="616">1600</text>
    <text x="1500" y="616">1800 ms</text>
  </g>

  <text class="hand" x="800" y="688" font-size="23" fill="var(--red)" text-anchor="middle">66% of the turn is two config timers waiting. No faster model fixes that.</text>
</svg>
</body>
</html>
