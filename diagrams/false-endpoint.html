<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A 260 ms pause, read as "done"</title>
<style>
  :root {
    --paper: #fbfaf6; --ink: #2a2823; --muted: #8a867c;
    --red: #b3382c; --red-fill: #f8e9e6; --box-fill: #ffffff;
  }
  [data-theme="dark"] {
    --paper: #1e1d1a; --ink: #e9e7e1; --muted: #8f8b81;
    --red: #e08070; --red-fill: #38251f; --box-fill: #26251f;
  }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  body { display: grid; place-items: center; }
  svg { display: block; }
  .hand { font-family: "Chalkboard SE", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.dataset.theme = t;
  else document.documentElement.dataset.theme =
    matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<svg viewBox="0 0 1600 760" width="1600" height="760" role="img"
     aria-label="Sequence diagram: a 260 ms pause is read as end of turn, the agent generates an answer to a fragment, it is discarded, then the real turn is answered.">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>
  </defs>

  <text class="hand" x="80" y="52" font-size="32" fill="var(--ink)">A 260 ms pause, read as “done”</text>
  <text class="mono" x="82" y="76" font-size="13.5" fill="var(--muted)">captured run · artifacts/turn-detection/</text>

  <g filter="url(#rough)" fill="none" stroke-width="1.8">
    <!-- lifelines -->
    <g stroke="var(--muted)" stroke-dasharray="5 6" stroke-width="1.4">
      <line x1="170" y1="146" x2="170" y2="716"/>
      <line x1="480" y1="146" x2="480" y2="716"/>
      <line x1="770" y1="146" x2="770" y2="716"/>
      <line x1="1050" y1="146" x2="1050" y2="716"/>
      <line x1="1330" y1="146" x2="1330" y2="716"/>
    </g>

    <!-- heads -->
    <g stroke="var(--ink)">
      <rect x="80"  y="90" width="180" height="56" rx="10" fill="var(--box-fill)"/>
      <rect x="385" y="90" width="190" height="56" rx="10" fill="var(--box-fill)"/>
      <rect x="675" y="90" width="190" height="56" rx="10" fill="var(--box-fill)"/>
      <rect x="955" y="90" width="190" height="56" rx="10" fill="var(--box-fill)"/>
      <rect x="1235" y="90" width="190" height="56" rx="10" fill="var(--box-fill)"/>
    </g>

    <!-- the pause note -->
    <rect x="330" y="196" width="300" height="42" rx="8" fill="var(--red-fill)" stroke="var(--red)" stroke-width="2"/>

    <!-- turn one: the wrong path -->
    <g stroke="var(--ink)">
      <line x1="178" y1="180" x2="472" y2="180"/><path d="M464 173 L476 180 L464 187"/>
    </g>
    <g stroke="var(--red)">
      <line x1="488" y1="280" x2="762" y2="280" stroke-dasharray="8 5"/><path d="M754 273 L766 280 L754 287"/>
      <line x1="778" y1="325" x2="1042" y2="325"/><path d="M1034 318 L1046 325 L1034 332"/>
      <line x1="1058" y1="370" x2="1322" y2="370"/><path d="M1314 363 L1326 370 L1314 377"/>
    </g>
    <!-- cancelled generation: x on Kokoro, dashed red strike back -->
    <g stroke="var(--red)" stroke-width="2.2">
      <path d="M1322 395 L1340 413 M1340 395 L1322 413"/>
      <line x1="1318" y1="404" x2="190" y2="404" stroke-dasharray="4 7" stroke-width="1.6"/>
    </g>

    <!-- divider -->
    <line x1="60" y1="460" x2="1540" y2="460" stroke="var(--muted)" stroke-dasharray="2 8" stroke-width="1.4"/>

    <!-- turn two: the real answer -->
    <g stroke="var(--ink)">
      <line x1="178" y1="495" x2="472" y2="495"/><path d="M464 488 L476 495 L464 502"/>
      <line x1="488" y1="540" x2="762" y2="540"/><path d="M754 533 L766 540 L754 547"/>
      <line x1="778" y1="585" x2="1042" y2="585"/><path d="M1034 578 L1046 585 L1034 592"/>
      <line x1="1058" y1="630" x2="1322" y2="630"/><path d="M1314 623 L1326 630 L1314 637"/>
      <line x1="1322" y1="685" x2="180" y2="685" stroke-dasharray="8 5"/><path d="M188 678 L176 685 L188 692"/>
    </g>
  </g>

  <!-- head labels -->
  <g text-anchor="middle">
    <text class="hand" x="170" y="114" font-size="19" fill="var(--ink)">Speaker</text>
    <text class="mono" x="170" y="133" font-size="11.5" fill="var(--muted)">one sentence</text>
    <text class="hand" x="480" y="114" font-size="19" fill="var(--ink)">Silero VAD</text>
    <text class="mono" x="480" y="133" font-size="11.5" fill="var(--muted)">stop_secs = 0.2 s</text>
    <text class="hand" x="770" y="114" font-size="19" fill="var(--ink)">Whisper</text>
    <text class="mono" x="770" y="133" font-size="11.5" fill="var(--muted)">MLX · segmented</text>
    <text class="hand" x="1050" y="114" font-size="19" fill="var(--ink)">Llama 3.2</text>
    <text class="mono" x="1050" y="133" font-size="11.5" fill="var(--muted)">Ollama</text>
    <text class="hand" x="1330" y="114" font-size="19" fill="var(--ink)">Kokoro</text>
    <text class="mono" x="1330" y="133" font-size="11.5" fill="var(--muted)">TTS · ONNX</text>
  </g>

  <!-- message labels -->
  <text class="mono" x="325" y="170" font-size="13" fill="var(--ink)" text-anchor="middle">speech begins</text>
  <text class="hand" x="480" y="222" font-size="16" fill="var(--red)" text-anchor="middle">260 ms pause ≥ stop_secs — “done!”</text>
  <g class="mono" font-size="13" fill="var(--red)" text-anchor="middle">
    <text x="625" y="270">end of turn (wrong)</text>
    <text x="910" y="315">fragment: “Can you tell me?”</text>
    <text x="1190" y="360">~600 ms answering the fragment</text>
    <text x="750" y="394">cancelled after ~2 ms — no audio reaches anyone</text>
  </g>
  <text class="hand" x="82" y="452" font-size="17" fill="var(--muted)">turn two — the real answer</text>
  <g class="mono" font-size="13" fill="var(--ink)" text-anchor="middle">
    <text x="325" y="485">…still speaking</text>
    <text x="625" y="530">real end of turn</text>
    <text x="910" y="575">full transcript</text>
    <text x="1190" y="620">second generation ~550 ms</text>
    <text x="750" y="675">first audio — ≈ 2.4 s after speech ended</text>
  </g>
</svg>
</body>
</html>
