[project]
name = "voice-infer-stack"
version = "1.0.1"
description = "A local voice agent you can watch, stage by stage, while it answers you"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "pipecat-ai[kokoro,local,local-smart-turn,mlx-whisper,piper,silero,tracing,whisper]==1.8.1",
    "soundfile>=0.14.0",
    "transformers>=4.48,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
